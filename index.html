<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PetMatch · Bigotes y Colitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#f2f6f1;--card:#fff;--ink:#1c2a26;--mut:#5d6f69;--line:#d8e2dc;--pri:#2f5d50;--pri-d:#224439;--sun:#f2b84b;--ok:#dcefe3;--ok-t:#1f5a37;--rev:#fdf0cf;--rev-t:#7a5410;--no:#f9dcd8;--no-t:#8a2a20;--nd:#e6e8ee;--nd-t:#3b4254}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Nunito Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;font-weight:700;line-height:1.15}
header{background:var(--pri);color:#fff;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font:700 20px "Bricolage Grotesque",sans-serif;cursor:pointer;background:none;border:0;color:#fff;padding:0;text-align:left}
.logo i{color:var(--sun);font-size:26px}
.logo small{display:block;font:400 11px "Nunito Sans",sans-serif;opacity:.8}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:#fff;padding:8px 14px;border-radius:999px;font:600 14px "Nunito Sans",sans-serif;cursor:pointer}
nav button.on{background:#fff;color:var(--pri-d)}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who button{border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font:600 13px "Nunito Sans",sans-serif}
main{max-width:980px;width:100%;margin:0 auto;padding:24px 20px 40px;flex:1}
footer{text-align:center;font-size:13px;color:var(--mut);padding:16px}
footer button{background:none;border:0;color:var(--pri);text-decoration:underline;cursor:pointer;font:inherit}
.hero{margin-bottom:18px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.hero h1{font-size:clamp(26px,5vw,36px)}
.hero p{color:var(--mut);margin:6px 0 0;max-width:58ch}
.ev{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--mut)}
.ev span{background:#fff;border:1px dashed var(--pri);color:var(--pri-d);border-radius:6px;padding:1px 7px;font-weight:700}
.btn{border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:10px;font:700 15px "Nunito Sans",sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--pri-d)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.alt:hover{background:var(--bg)}
.btn.bad{background:var(--no-t)}
.btn.bad:hover{background:#6e1f17}
.btn.block{width:100%;justify-content:center}
.btn.lg{padding:13px 24px;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
label{font-size:14px;font-weight:700;display:grid;gap:4px}
form{display:grid;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.ph{height:110px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:10px}
.pet h3{font-size:18px}
.pet p{margin:2px 0 8px;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.e-Disponible,.e-Aprobada{background:var(--ok);color:var(--ok-t)}
.e-Pendiente{background:var(--rev);color:var(--rev-t)}
.e-Rechazada{background:var(--no);color:var(--no-t)}
.e-nd{background:var(--nd);color:var(--nd-t)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:19px;margin-bottom:12px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px}
dt{color:var(--mut)}dd{margin:0;text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font:700 28px "Bricolage Grotesque",sans-serif}
.stat span{font-size:13px;color:var(--mut)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mut);padding:26px 0;text-align:center}
.err{color:var(--no-t);font-size:13px;min-height:18px}
.back{background:none;border:0;color:var(--pri);font:700 14px "Nunito Sans",sans-serif;cursor:pointer;padding:0;margin-bottom:12px}
.landing-hero{background:linear-gradient(180deg,var(--pri),var(--pri-d));color:#fff;border-radius:18px;padding:40px 28px;text-align:center;margin-bottom:28px}
.landing-hero h1{font-size:clamp(28px,6vw,42px)}
.landing-hero p{opacity:.92;max-width:54ch;margin:10px auto 22px}
.banner{background:var(--ok);color:var(--ok-t);border-radius:12px;padding:14px 18px;font-size:14px;margin-top:24px;display:flex;gap:10px;align-items:center}
.auth{max-width:420px;margin:24px auto}
.demo{display:grid;gap:8px;margin-top:14px}
.demo button{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:600 14px "Nunito Sans",sans-serif;cursor:pointer;text-align:left;color:var(--ink)}
.demo button:hover{border-color:var(--pri)}
.demo small{color:var(--mut);font-weight:400}
.ba{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:8px 0 14px}
.ba .box{background:var(--bg);border-radius:10px;padding:10px;text-align:center;font-size:14px}
.ba .box b{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:4px}
.ba i{font-size:22px;color:var(--pri)}
.ok-msg{background:var(--ok);color:var(--ok-t);border-radius:12px;padding:12px 16px;font-weight:700;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.ko-msg{background:var(--no);color:var(--no-t);border-radius:12px;padding:12px 16px;font-weight:700;margin-bottom:16px;display:flex;gap:8px;align-items:center}
.note{font-size:14px;color:var(--mut);background:var(--bg);border-radius:10px;padding:10px 12px}
.confirm{max-width:520px;margin:30px auto;text-align:center}
.confirm i{font-size:44px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;border-top:0}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:520px){.ba{grid-template-columns:1fr}.ba i{transform:rotate(90deg);justify-self:center}}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<footer><button data-go="traza">Trazabilidad: historia de usuario, criterio y pantalla</button> · Mockup PMV2 · Bigotes y Colitas</footer>

<script>
const COLORS=["#dcefe3","#fdf0cf","#e3e6f3","#f9dcd8","#d9ecf3","#efe3f5"];
let pets=[
{id:1,nombre:"Luna",especie:"Perro",edad:"2 años",salud:"Vacunada y esterilizada",disp:true},
{id:2,nombre:"Michi",especie:"Gato",edad:"6 meses",salud:"Vacunas al día",disp:true},
{id:3,nombre:"Rocky",especie:"Perro",edad:"4 años",salud:"Chequeo al día",disp:true},
{id:4,nombre:"Nube",especie:"Gato",edad:"3 años",salud:"Vacunada y esterilizada",disp:false},
{id:5,nombre:"Toby",especie:"Perro",edad:"5 meses",salud:"Primera dosis de vacunas",disp:true},
{id:6,nombre:"Canela",especie:"Perro",edad:"6 años",salud:"Chequeo completo",disp:true}];
const users=[
{email:"juan@demo.com",pass:"1234",nombre:"Juan Pérez",rol:"adoptante"},
{email:"ana@demo.com",pass:"1234",nombre:"Ana Gómez",rol:"adoptante"},
{email:"encargada@demo.com",pass:"1234",nombre:"Laura Ríos",rol:"encargado"}];
let reqs=[
{id:1,pet:1,email:"juan@demo.com",fecha:"02/10/2026",estado:"Pendiente"},
{id:2,pet:2,email:"ana@demo.com",fecha:"03/10/2026",estado:"Pendiente"},
{id:3,pet:4,email:"ana@demo.com",fecha:"20/09/2026",estado:"Aprobada"},
{id:4,pet:3,email:"ana@demo.com",fecha:"25/09/2026",estado:"Rechazada"}];
const S={view:"landing",user:null,pet:null,req:null};
const ADOP=["catalogo","ficha","enviar","enviada","mis","detalleA"];
const ENC=["panel","detalleE","confApr","confRech","resApr","resRech"];
const $=s=>document.querySelector(s);
const getPet=id=>pets.find(p=>p.id===id);
const getUser=e=>users.find(u=>u.email===e);
const tagE=e=>`<span class="tag e-${e}">${e}</span>`;
const tagP=p=>p.disp?`<span class="tag e-Disponible">Disponible</span>`:`<span class="tag e-nd">No disponible · Adoptada</span>`;
const ic=e=>e==="Gato"?"ti-cat":"ti-dog";
const ev=(...a)=>`<div class="ev" aria-label="Evidencia de criterios">Evidencia: ${a.map(x=>`<span>${x}</span>`).join("")}</div>`;
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const hoy=()=>new Date().toLocaleDateString("es-CO");
const avail=()=>pets.filter(p=>p.disp);
const petsPanel=()=>`<h3 style="margin:16px 0 8px;font-size:16px">Disponibilidad de las mascotas</h3><div class="chips">${pets.map(p=>`<span style="display:inline-flex;gap:6px;align-items:center">${p.nombre} ${tagP(p)}</span>`).join("")}</div>`;
function go(v,x){Object.assign(S,{view:v},x||{});render();window.scrollTo(0,0)}
function petCard(p,btn){return `<div class="pet"><div class="ph" style="background:${COLORS[p.id%6]}"><i class="ti ${ic(p.especie)}" aria-hidden="true"></i></div><h3>${p.nombre}</h3><p>${p.especie} · ${p.edad} · ${p.salud}</p>${tagP(p)}${btn?`<div style="margin-top:8px"><button class="btn alt block" data-go="ficha" data-pet="${p.id}">Ver ficha</button></div>`:""}</div>`}

const V={
landing(){return `<div class="landing-hero"><h1><i class="ti ti-paw" aria-hidden="true"></i> PetMatch</h1><p>Bigotes y Colitas: una plataforma para organizar la adopción responsable entre fundaciones y adoptantes.</p><button class="btn lg" style="background:var(--sun);color:var(--pri-d)" data-go="catalogo">Consultar mascotas</button> <button class="btn lg alt" data-go="login">Iniciar sesión</button></div>
<div class="hero"><div><h1>Mascotas disponibles</h1><p>Inicia sesión como adoptante para ver la ficha y enviar una solicitud.</p></div></div>
<div class="grid">${avail().slice(0,3).map(p=>petCard(p,false)).join("")}</div>
<div class="banner"><i class="ti ti-heart-handshake" aria-hidden="true" style="font-size:22px"></i> Adoptar es una decisión responsable. Cada solicitud es revisada por el encargado de adopciones.</div>`},
login(){return `<div class="auth"><div class="panel"><h2>Iniciar sesión</h2>
<form id="fl" novalidate><label>Correo<input id="le" type="email" autocomplete="email" placeholder="tu@correo.com"></label>
<label>Contraseña<input id="lp" type="password" autocomplete="current-password" placeholder="••••"></label>
<div class="err" id="lerr" role="alert"></div>
<button class="btn block" type="submit"><i class="ti ti-login-2" aria-hidden="true"></i> Iniciar sesión</button></form>
<p class="note" style="margin-top:14px">El menú y las acciones cambian según el tipo de usuario: adoptante o encargado de adopciones.</p>
<div class="demo"><b style="font-size:13px">Cuentas de prueba (contraseña 1234)</b>
<button data-do="demo" data-u="juan@demo.com">Juan Pérez <small>Adoptante</small></button>
<button data-do="demo" data-u="ana@demo.com">Ana Gómez <small>Adoptante</small></button>
<button data-do="demo" data-u="encargada@demo.com">Laura Ríos <small>Encargada de adopciones</small></button></div></div>
<div style="margin-top:10px">${ev("Sesión de usuario","HU2-03")}</div></div>`},
catalogo(){const l=avail();return `<div class="hero"><div><h1>Consultar mascotas</h1><p>Solo se muestran las mascotas disponibles.</p></div>${ev("HU3-04","HU4-04")}</div>
${l.length?`<div class="grid">${l.map(p=>petCard(p,true)).join("")}</div>`:`<p class="empty">No hay mascotas disponibles por ahora.</p>`}`},
ficha(){const p=getPet(S.pet),mine=reqs.find(r=>r.pet===p.id&&r.email===S.user.email);
return `<button class="back" data-go="catalogo"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a mascotas</button>
<div class="panel"><div class="ph" style="height:190px;font-size:76px;background:${COLORS[p.id%6]}"><i class="ti ${ic(p.especie)}" aria-hidden="true"></i></div>
<h2 style="font-size:26px;margin-bottom:8px">${p.nombre} ${tagP(p)}</h2>
<dl style="margin-bottom:14px"><dt>Especie</dt><dd>${p.especie}</dd><dt>Edad</dt><dd>${p.edad}</dd><dt>Estado de salud</dt><dd>${p.salud}</dd></dl>
${mine?`<p class="note">Ya enviaste una solicitud para ${p.nombre}. Estado: ${tagE(mine.estado)}</p><div style="margin-top:10px"><button class="btn alt" data-go="mis">Ir a Mis solicitudes</button></div>`
:p.disp?`<button class="btn block lg" data-go="enviar" data-pet="${p.id}"><i class="ti ti-heart" aria-hidden="true"></i> Enviar solicitud de adopción</button>`
:`<p class="note">${p.nombre} ya no está disponible para nuevas solicitudes.</p>`}</div>`},
enviar(){const p=getPet(S.pet);
return `<button class="back" data-go="ficha" data-pet="${p.id}"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a la ficha</button>
<div class="hero"><div><h1>Enviar solicitud de adopción</h1><p>Revisa los datos y envía la solicitud para iniciar el proceso.</p></div>${ev("HU1-E03")}</div>
<div class="two"><div class="panel"><h2>Mascota</h2><dl><dt>Nombre</dt><dd>${p.nombre}</dd><dt>Especie</dt><dd>${p.especie}</dd><dt>Edad</dt><dd>${p.edad}</dd><dt>Disponibilidad</dt><dd>${tagP(p)}</dd></dl></div>
<div class="panel"><h2>Adoptante</h2><dl><dt>Nombre</dt><dd>${S.user.nombre}</dd><dt>Correo</dt><dd>${S.user.email}</dd></dl>
<p class="note" style="margin:12px 0">Al enviarla, la solicitud quedará en estado Pendiente.</p>
<button class="btn block" data-do="enviarSol"><i class="ti ti-send" aria-hidden="true"></i> Enviar solicitud de adopción</button></div></div>`},
enviada(){const r=reqs.find(x=>x.id===S.req),p=getPet(r.pet);
return `<div class="confirm panel"><i class="ti ti-circle-check" style="color:var(--ok-t)" aria-hidden="true"></i><h2 style="margin:8px 0">Solicitud registrada</h2>
<p>Tu solicitud para <b>${p.nombre}</b> fue registrada el ${r.fecha}.</p><p>Estado: ${tagE(r.estado)}</p>
<button class="btn" data-go="mis">Ir a Mis solicitudes</button></div>`},
mis(){const l=reqs.filter(r=>r.email===S.user.email);
return `<div class="hero"><div><h1>Mis solicitudes</h1><p>Solicitudes de ${S.user.nombre}. Solo ves las de tu cuenta.</p></div>${ev("HU2-01","HU2-02","HU2-03")}</div>
<div class="panel"><label style="margin-bottom:8px">Buscar por mascota<input id="q" type="search" placeholder="Ej. Luna"></label>
${l.length?`<div id="lista">${l.map(r=>{const p=getPet(r.pet);return `<div class="row" data-n="${p.nombre.toLowerCase()}"><span><b>${p.nombre}</b><br><small style="color:var(--mut)">Fecha de solicitud: ${r.fecha}</small></span><span class="acts">${tagE(r.estado)}<button class="btn alt" data-go="detalleA" data-req="${r.id}">Ver detalle</button></span></div>`}).join("")}</div><p class="empty" id="sinres" hidden>No hay solicitudes con ese nombre.</p>`
:`<p class="empty">Aún no has enviado solicitudes. Consulta las mascotas disponibles para empezar.</p>`}</div>`},
detalleA(){const r=reqs.find(x=>x.id===S.req),p=getPet(r.pet);
const msg={Pendiente:"Tu solicitud está pendiente de revisión por el encargado de adopciones.",Aprobada:"Tu solicitud fue aprobada. Puedes continuar el proceso de adopción.",Rechazada:"Tu solicitud fue rechazada: no cumple los requisitos establecidos para la adopción."}[r.estado];
return `<button class="back" data-go="mis"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a Mis solicitudes</button>
<div class="hero"><div><h1>Detalle de mi solicitud</h1></div>${ev("HU2-01","HU2-02")}</div>
<div class="two"><div class="panel"><h2>Solicitud de adopción</h2><dl><dt>Mascota</dt><dd>${p.nombre}</dd><dt>Fecha de solicitud</dt><dd>${r.fecha}</dd><dt>Estado</dt><dd>${tagE(r.estado)}</dd></dl><p class="note" style="margin-top:12px">${msg}</p></div>
<div class="panel"><h2>Mascota</h2><dl><dt>Especie</dt><dd>${p.especie}</dd><dt>Edad</dt><dd>${p.edad}</dd><dt>Disponibilidad</dt><dd>${tagP(p)}</dd></dl></div></div>`},
panel(){const l=[...reqs].sort((a,b)=>(a.estado==="Pendiente"?0:1)-(b.estado==="Pendiente"?0:1));
return `<div class="hero"><div><h1>Solicitudes de adopción</h1><p>Selecciona una solicitud pendiente para revisarla.</p></div>${ev("HU3-01","HU4-01")}</div>
<div class="panel"><label style="margin-bottom:10px">Buscar solicitudes por adoptante o mascota<input id="qe" type="search" placeholder="Ej. Ana o Luna"></label><div class="scroll"><table id="tbe"><thead><tr><th>Adoptante</th><th>Mascota</th><th>Estado</th><th>Acción</th></tr></thead><tbody>
${l.map(r=>{const p=getPet(r.pet),u=getUser(r.email);return `<tr data-n="${(u.nombre+" "+p.nombre).toLowerCase()}"><td>${u.nombre}</td><td>${p.nombre}</td><td>${tagE(r.estado)}</td><td>${r.estado==="Pendiente"?`<button class="btn" data-go="detalleE" data-req="${r.id}">Revisar solicitud</button>`:`<button class="btn alt" data-go="detalleE" data-req="${r.id}">Ver detalle</button>`}</td></tr>`}).join("")}</tbody></table></div><p class="empty" id="sinrese" hidden>No hay solicitudes que coincidan.</p></div>`},
detalleE(){const r=reqs.find(x=>x.id===S.req),p=getPet(r.pet),u=getUser(r.email),pen=r.estado==="Pendiente";
return `<button class="back" data-go="panel"><i class="ti ti-arrow-left" aria-hidden="true"></i> Volver a solicitudes</button>
<div class="hero"><div><h1>Detalle de la solicitud</h1></div>${ev("HU3-02","HU4-02")}</div>
<div class="two"><div class="panel"><h2>Adoptante</h2><dl><dt>Nombre</dt><dd>${u.nombre}</dd><dt>Correo</dt><dd>${u.email}</dd><dt>Fecha de solicitud</dt><dd>${r.fecha}</dd></dl></div>
<div class="panel"><h2>Mascota</h2><dl><dt>Nombre</dt><dd>${p.nombre}</dd><dt>Especie</dt><dd>${p.especie}</dd><dt>Edad</dt><dd>${p.edad}</dd><dt>Disponibilidad</dt><dd>${tagP(p)}</dd></dl></div></div>
<div class="panel" style="margin-top:18px"><h2>Estado actual: ${tagE(r.estado)}</h2>
${pen?`<div class="acts"><button class="btn lg" data-go="confApr" data-req="${r.id}"><i class="ti ti-check" aria-hidden="true"></i> Aprobar solicitud</button><button class="btn lg bad" data-go="confRech" data-req="${r.id}"><i class="ti ti-x" aria-hidden="true"></i> Rechazar solicitud</button></div>`
:`<p class="note">Esta solicitud ya tiene un estado asignado, por lo que no admite una nueva decisión.</p>`}</div>`},
confApr(){const r=reqs.find(x=>x.id===S.req),p=getPet(r.pet);
return `<div class="confirm panel"><i class="ti ti-help-circle" style="color:var(--pri)" aria-hidden="true"></i><h2 style="margin:8px 0">¿Confirmar aprobación?</h2>
<p><b>¿Desea aprobar esta solicitud?</b></p><p>La solicitud de ${getUser(r.email).nombre} por ${p.nombre} será aprobada y la mascota dejará de aparecer como disponible.</p>
<div class="acts" style="justify-content:center"><button class="btn alt" data-go="detalleE" data-req="${r.id}">Cancelar</button><button class="btn" data-do="aprobar">Confirmar aprobación</button></div>${ev("HU3-03")}</div>`},
confRech(){const r=reqs.find(x=>x.id===S.req),p=getPet(r.pet);

function head(){
  const u=S.user,items=!u?[]:u.rol==="adoptante"?[["catalogo","Mascotas"],["mis","Mis solicitudes"]]:[["panel","Solicitudes de adopción"]];
  const on=k=>S.view===k||(k==="catalogo"&&["ficha","enviar","enviada"].includes(S.view))||(k==="mis"&&S.view==="detalleA")||(k==="panel"&&["detalleE","confApr","confRech","resApr","resRech"].includes(S.view));
  $("#hd").innerHTML=`<button class="logo" data-go="${!u?"landing":u.rol==="adoptante"?"catalogo":"panel"}"><i class="ti ti-paw" aria-hidden="true"></i><span>PetMatch<small>Bigotes y Colitas</small></span></button>
  <nav aria-label="Principal">${items.map(([k,l])=>`<button data-go="${k}" class="${on(k)?"on":""}">${l}</button>`).join("")}</nav>
  ${u?`<div class="who">${u.nombre} · ${u.rol==="adoptante"?"Adoptante":"Encargada de adopciones"} <button data-do="logout">Salir</button></div>`:(S.view!=="login"?`<div class="who"><button data-go="login">Iniciar sesión</button></div>`:"")}`;
}
function render(){
  const u=S.user;
  if(ADOP.includes(S.view)&&(!u||u.rol!=="adoptante"))S.view=u?"panel":"login";
  else if(ENC.includes(S.view)&&(!u||u.rol!=="encargado"))S.view=u?"catalogo":"login";
  if(["detalleA"].includes(S.view)){const r=reqs.find(x=>x.id===S.req);if(!r||r.email!==u.email)S.view="mis"}
  if(["ficha","enviar"].includes(S.view)&&!getPet(S.pet))S.view="catalogo";
  head();$("#app").innerHTML=V[S.view]();
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");
  if(g){const d=g.dataset,x={};if(d.pet)x.pet=+d.pet;if(d.req)x.req=+d.req;go(d.go,x);return}
  const a=e.target.closest("[data-do]");if(!a)return;
  const k=a.dataset.do;
  if(k==="logout"){S.user=null;go("landing")}
  else if(k==="demo")login(a.dataset.u,"1234");
  else if(k==="enviarSol"){
    if(reqs.some(r=>r.pet===S.pet&&r.email===S.user.email)||!getPet(S.pet).disp)return;
    const id=Math.max(...reqs.map(r=>r.id))+1;
    reqs.push({id,pet:S.pet,email:S.user.email,fecha:hoy(),estado:"Pendiente"});go("enviada",{req:id})}
  else if(k==="verAdop"){const r=reqs.find(x=>x.id===+a.dataset.req);S.user=getUser(r.email);go("detalleA",{req:r.id})}
  else if(k==="aprobar"){const r=reqs.find(x=>x.id===S.req);if(r.estado!=="Pendiente")return;r.estado="Aprobada";getPet(r.pet).disp=false;go("resApr")}
  else if(k==="rechazar"){const r=reqs.find(x=>x.id===S.req);if(r.estado!=="Pendiente")return;r.estado="Rechazada";go("resRech")}
});
document.addEventListener("submit",e=>{if(e.target.id==="fl"){e.preventDefault();login($("#le").value.trim(),$("#lp").value)}});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;
  const t=e.target.value.trim().toLowerCase();let n=0;
  document.querySelectorAll("#lista .row").forEach(r=>{const show=r.dataset.n.includes(t);r.hidden=!show;if(show)n++});
  $("#sinres").hidden=n>0});
document.addEventListener("input",e=>{if(e.target.id!=="qe")return;
  const t=e.target.value.trim().toLowerCase();let n=0;
  document.querySelectorAll("#tbe tbody tr").forEach(r=>{const show=r.dataset.n.includes(t);r.hidden=!show;if(show)n++});
  $("#sinrese").hidden=n>0});
function login(email,pass){
  const err=m=>{const x=$("#lerr");if(x)x.textContent=m};
  if(!EMAIL_RE.test(email))return err("Ingresa un correo válido, por ejemplo nombre@dominio.com.");
  const u=users.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.pass===pass);
  if(!u)return err("Correo o contraseña incorrectos.");
  S.user=u;go(u.rol==="adoptante"?"catalogo":"panel");
}
render();
